[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coco-scop"
version = "0.1.0"
description = "COCO adaptation of the CoMPaSS SCOP data pipeline"
readme = "data_pipeline/README.md"
requires-python = ">=3.10"
dependencies = [
  "pillow>=10.0.0",
  "requests>=2.31.0",
  "tqdm>=4.66.0",
]

[project.scripts]
coco-scop = "data_pipeline.__main__:main"
coco-download = "data_pipeline.download_coco:main"

[tool.setuptools]
packages = ["data_pipeline"]
