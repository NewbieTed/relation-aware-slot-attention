[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coco-scop"
version = "0.1.0"
description = "COCO adaptation of the CoMPaSS SCOP data pipeline"
readme = "SCOP/README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "pillow>=10.0.0",
  "requests>=2.31.0",
  "torch>=2.5.0",
  "transformers>=4.45.0",
  "tqdm>=4.66.0",
]

[project.scripts]
coco-scop = "SCOP.__main__:main"

[tool.setuptools]
packages = ["SCOP"]
