paths:
  dataset_dir: /local1/cse_481_m_l/relation-aware-slot-attention/data/scop_depth_crops_depth
  output_dir: /local1/cchen025/outputs/train/graph_pretrain_flux_3dbox_triple_cvae_3dsln_film_v2
  label_embedding_cache: /local1/cchen025/outputs/cache/gnn_label_embeddings_flux1dev_t5.pt

model:
  model_id: black-forest-labs/FLUX.1-dev
  text_encoder_type: t5
  text_hidden_dim: 4096
  slot_dim: 512
  gnn_layers: 5
  layout_mode: triple_cvae
  latent_dim: 64

runtime:
  device: cuda
  mixed_precision: bf16
  num_workers: 0
  seed: 42
  disable_tqdm: false

data:
  batch_size: 128
  limit_rows:
  prompt_prefix: a photo of
  eval_fraction: 0.1
  test_fraction: 0.1

training:
  graph_learning_rate: 1.0e-4
  max_train_steps: 5000
  save_every: 1000
  log_every: 25
  eval_every: 250

losses:
  position_loss_weight: 0.0
  relation_loss_weight: 0.0
  embedding_loss_weight: 0.0
  inverse_relation_loss_weight: 0.0
  box_loss_weight: 0.0
  box3d_loss_weight: 1.0
  cvae_kl_weight: 0.1
  cvae_kl_warmup_steps: 500
