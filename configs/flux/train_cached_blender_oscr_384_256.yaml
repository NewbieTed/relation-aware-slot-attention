paths:
  dataset_dir: /local1/cse_481_m_l/relation-aware-slot-attention/data/scop_depth_crops_depth
  precomputed_cache_dir: /local1/cse_481_m_l/relation-aware-slot-attention/outputs/cache/flux_blender_oscr_384_256_bf16
  output_dir: /local1/cse_481_m_l/relation-aware-slot-attention/outputs/train/flux_lora_cached_blender_oscr_gpu7
  init_graph_encoder: /local1/cse_481_m_l/relation-aware-slot-attention/outputs/train/graph_pretrain_flux_3dbox_gpu7/final/graph_encoder.pt

model:
  model_id: black-forest-labs/FLUX.1-dev
  slot_dim: 512
  gnn_layers: 2
  lora_rank: 32
  lora_alpha: 32
  flux_quantization: 4bit
  max_sequence_length: 128
  guidance_scale: 3.5

runtime:
  device: cuda
  mixed_precision: bf16
  low_vram: false
  gradient_checkpointing: false
  num_workers: 0
  seed: 42
  disable_tqdm: false

data:
  image_size: 384
  oscr_size: 256
  batch_size: 1
  limit_rows:
  eval_fraction: 0.1
  test_fraction: 0.1
  prompt_prefix: a photo of

training:
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-5
  max_train_steps: 12000
  save_every: 1000
  log_every: 50

rendering:
  condition_renderer: blender
  oscr_face_alpha: 0.0025
  oscr_azimuth_degrees: 0.0
  blender_bin: /local1/cse_481_m_l/blender/blender-3.6.19-linux-x64/blender
  blender_cache_dir: /local1/cse_481_m_l/relation-aware-slot-attention/outputs/cache/blender_oscr_train_384_256

eval:
  eval_every: 1000
  eval_sample_count: 0
  eval_inference_steps: 12
  eval_sample_seed: 1234
  eval_blender_oscr: false
  eval_blender_face_alpha: 0.25
  external_eval_gpu:
  external_eval_python:
