[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scop-depth"
version = "0.1.0"
description = "SCOP-Depth: a depth-augmented extension of the CoMPaSS SCOP data pipeline"
readme = "scop_depth/README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "pillow>=10.0.0",
  "requests>=2.31.0",
  "torch>=2.5.0",
  "transformers>=4.45.0",
  "tqdm>=4.66.0",
]

[project.scripts]
scop-depth = "scop_depth.__main__:main"

[tool.setuptools]
packages = ["scop_depth"]
