paths:
  dataset_dir: /local1/cse_481_m_l/relation-aware-slot-attention/data/scop_depth_crops_depth_aug_rel10
  output_dir: /local1/cse_481_m_l/relation-aware-slot-attention/outputs/train/graph_pretrain_flux_3dbox_triple_cvae_3dsln_residual_dropout02_rel1_box02_augrel10_3000
  label_embedding_cache: /local1/cse_481_m_l/relation-aware-slot-attention/outputs/cache/gnn_label_embeddings_flux1dev_t5.pt

model:
  model_id: black-forest-labs/FLUX.1-dev
  text_encoder_type: t5
  text_hidden_dim: 4096
  slot_dim: 512
  gnn_layers: 5
  layout_mode: triple_cvae
  latent_dim: 64
  decoder_node_dropout: 0.2
  decoder_box_residual: true
  decoder_box_residual_scale: 0.25

runtime:
  device: cuda
  mixed_precision: bf16
  num_workers: 0
  seed: 42
  disable_tqdm: false

data:
  batch_size: 128
  limit_rows:
  prompt_prefix: a photo of
  eval_fraction: 0.01
  test_fraction: 0.01

training:
  graph_learning_rate: 1.0e-4
  max_train_steps: 3000
  save_every: 500
  log_every: 25
  eval_every: 500

losses:
  position_loss_weight: 0.0
  relation_loss_weight: 0.0
  embedding_loss_weight: 0.0
  inverse_relation_loss_weight: 0.0
  box_loss_weight: 0.0
  box3d_loss_weight: 1.0
  cvae_kl_weight: 0.1
  cvae_kl_warmup_steps: 500
